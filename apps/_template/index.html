<!doctype html>
<html lang="ja">
<!--
  アプリ紹介のひな型。apps/<id>/index.html に写して使う（手順は CLAUDE.md）。
  【】で囲んだ所を全部埋める。埋め終わったら【 が残っていないか検索する。
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>【アプリ名】 | hitoma works</title>
  <meta name="description" content="【アプリ名】は、【一言の説明】。Android／iOS。">
  <link rel="stylesheet" href="../../assets/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap"><a class="brand" href="../../index.html">hitoma works</a></div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>【アプリ名】</h1>
      <p class="lead">【一言の説明】</p>
    </section>

    <section aria-labelledby="features">
      <h2 id="features">特長</h2>
      <!-- 3〜5 個。<strong> が見出し、その後ろが一文の説明 -->
      <ul class="features">
        <li><strong>【特長 1】</strong>【説明】</li>
        <li><strong>【特長 2】</strong>【説明】</li>
        <li><strong>【特長 3】</strong>【説明】</li>
      </ul>
    </section>

    <section aria-labelledby="screens">
      <h2 id="screens">画面</h2>
      <!-- スクリーンショットは assets/img/ に置き、.shot の中を <img src="../../assets/img/..." alt="..."> に差し替える -->
      <div class="shots">
        <div class="shot">スクリーン<br>ショット<br>（準備中）</div>
        <div class="shot">スクリーン<br>ショット<br>（準備中）</div>
        <div class="shot">スクリーン<br>ショット<br>（準備中）</div>
      </div>
    </section>

    <section aria-labelledby="download">
      <h2 id="download">ダウンロード</h2>
      <!-- 公開したら href をストアの URL に、中身を公式のバッジ画像（assets/img/）に差し替え、aria-disabled を外す -->
      <div class="badges">
        <a class="badge" href="#" aria-disabled="true"><small>Google Play</small><span>準備中</span></a>
        <a class="badge" href="#" aria-disabled="true"><small>App Store</small><span>準備中</span></a>
      </div>
      <p class="muted small">【対応 OS】に対応する予定です。</p>
    </section>

    <section aria-labelledby="links">
      <h2 id="links">サポート</h2>
      <ul class="link-list">
        <li><a href="support.html">サポート・よくある質問</a></li>
        <li><a href="privacy.html">プライバシーポリシー</a></li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 2026 hitoma works</span>
      <a href="../../privacy.html">プライバシーポリシー</a>
    </div>
  </footer>
</body>
</html>
